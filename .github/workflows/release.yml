name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: require the tag to match the app version
        shell: bash
        run: |
          set -euo pipefail
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version web/package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          tag=${GITHUB_REF#refs/tags/}
          if [[ "$tag" != "v$conf" || "$pkg" != "$conf" || "$cargo" != "$conf" ]]; then
            echo "Tag is $tag; tauri.conf.json is $conf; web/package.json is $pkg; Cargo.toml is $cargo." >&2
            exit 1
          fi

      - name: require updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]]; then
            echo "Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD before tagging." >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: build the frontend once
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

  release:
    needs: preflight
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: ubuntu-22.04-arm
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.platform }}-${{ matrix.rust_targets }}

      - name: install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: freeze the bundled ledger engine
        run: bash engine/build.sh

      - name: fetch the pinned restic binary
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.rust_targets }}"
          if [[ -z "$target" ]]; then
            case "${{ runner.os }}-${{ runner.arch }}" in
              Linux-X64) target=x86_64-unknown-linux-gnu ;;
              Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
              Windows-X64) target=x86_64-pc-windows-msvc ;;
              macOS-ARM64) target=aarch64-apple-darwin ;;
              macOS-X64) target=x86_64-apple-darwin ;;
              *) echo "no restic target for ${{ runner.os }} ${{ runner.arch }}" >&2; exit 1 ;;
            esac
          fi
          bash engine/fetch-restic.sh "$target"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: BeanDesk v__VERSION__
          releaseBody: Installers for macOS, Windows, and Linux. This version has no mobile build.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
